# Decap CMS — www.hwpx.co.kr
# GitHub OAuth: Pages secrets GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET
# Callback: https://<pages-host>/api/oauth/callback

locale: ko

backend:
  name: github
  repo: lab486486/hwpx
  branch: main
  base_url: https://hwpx-bp0.pages.dev
  auth_endpoint: api/oauth/auth
  auth_scope: repo
  squash_merges: true

local_backend: true

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: blog
    label: 글
    label_singular: 글
    folder: src/content/blog
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: 제목, name: title, widget: string }
      - label: 날짜
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"
      - label: URL 연도
        name: year
        widget: string
        default: "2026"
        hint: "퍼머링크 /YYYY/MM/slug.html 의 연도. 예: 2026"
      - label: URL 월
        name: month
        widget: string
        default: "09"
        hint: "두 자리 월. 예: 09"
      - label: 파일명 슬러그
        name: slug
        widget: string
        hint: "예: hancom-viewer → /2025/07/hancom-viewer.html"
      - { label: 설명, name: description, widget: text }
      - { label: 커버 이미지, name: cover_image, widget: image, required: false }
      - { label: 태그, name: tags, widget: list, required: false }
      - { label: 본문, name: body, widget: markdown }
